services:
  private-socks-http:
    image: ghcr.io/ztyawc/sing-box-private-socks:v2026.07.22-zty.1
    container_name: private-socks-http
    restart: unless-stopped
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:8080:8080/tcp"
    volumes:
      - ./config.json:/etc/sing-box/config.json:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
