name: Build private SOCKS multi-platform release

on:
  push:
    tags:
      - private-socks-v*
  workflow_dispatch:
    inputs:
      image_tag:
        description: Container image tag
        required: true
        default: v2026.07.23-zty.2
        type: string
      release_tag:
        description: GitHub Release tag
        required: true
        default: private-socks-v2026.07.23-zty.2
        type: string
      publish_release:
        description: Publish binaries and documentation as a public GitHub Release
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: private-socks-release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: 1.25.12
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/sing-box-private-socks
  IMAGE_TAG: ${{ inputs.image_tag || 'v2026.07.23-zty.2' }}
  RELEASE_TAG: ${{ inputs.release_tag || 'private-socks-v2026.07.23-zty.2' }}
  VERSION_NAME: private-socks-${{ inputs.image_tag || 'v2026.07.23-zty.2' }}

jobs:
  verify:
    name: Verify source and configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Test private SOCKS implementation
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          go test -count=1 ./protocol/socks ./option
          go run ./cmd/sing-box check -c docker/private-socks/config.example.json

  build-binaries:
    name: Build ${{ matrix.id }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-amd64
            goos: linux
            goarch: amd64
            archive: tar
          - id: linux-arm64
            goos: linux
            goarch: arm64
            archive: tar
          - id: linux-armv7
            goos: linux
            goarch: arm
            goarm: "7"
            archive: tar
          - id: windows-amd64
            goos: windows
            goarch: amd64
            extension: .exe
            archive: zip
          - id: windows-arm64
            goos: windows
            goarch: arm64
            extension: .exe
            archive: zip
          - id: darwin-amd64
            goos: darwin
            goarch: amd64
            archive: tar
          - id: darwin-arm64
            goos: darwin
            goarch: arm64
            archive: tar

    steps:
      - name: Checkout exact source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Build and package
        shell: bash
        env:
          TARGET_ID: ${{ matrix.id }}
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
          TARGET_ARM: ${{ matrix.goarm }}
          TARGET_EXTENSION: ${{ matrix.extension }}
          ARCHIVE_TYPE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          build_tags="$(cat release/DEFAULT_BUILD_TAGS_OTHERS)"
          shared_ldflags="$(cat release/LDFLAGS)"
          archive_base="sing-box-private-socks-$TARGET_ID"
          package_dir="$RUNNER_TEMP/$archive_base"
          artifact_dir="$GITHUB_WORKSPACE/artifact"
          executable="$package_dir/sing-box$TARGET_EXTENSION"
          mkdir -p "$package_dir" "$artifact_dir"

          CGO_ENABLED=0 GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" GOARM="$TARGET_ARM" go build -trimpath -tags "$build_tags" -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=$VERSION_NAME' $shared_ldflags -s -w -buildid=" -o "$executable" ./cmd/sing-box

          chmod 0755 "$executable"
          cp LICENSE "$package_dir/LICENSE"
          cp docker/private-socks/config.example.json "$package_dir/config.example.json"
          cp docker/private-socks/README.zh.md "$package_dir/README.zh.md"
          file "$executable" | tee "$artifact_dir/$archive_base.info.txt"

          if [[ "$ARCHIVE_TYPE" == "zip" ]]; then
            (
              cd "$RUNNER_TEMP"
              zip -9 -r "$artifact_dir/$archive_base.zip" "$archive_base"
            )
            archive_file="$artifact_dir/$archive_base.zip"
          else
            tar -C "$RUNNER_TEMP" -czf "$artifact_dir/$archive_base.tar.gz" "$archive_base"
            archive_file="$artifact_dir/$archive_base.tar.gz"
          fi
          (
            cd "$artifact_dir"
            sha256sum "$(basename "$archive_file")" > "$(basename "$archive_file").sha256"
          )

          if [[ "$TARGET_ID" == "linux-amd64" || "$TARGET_ID" == "linux-arm64" ]]; then
            cp "$executable" "$artifact_dir/$archive_base"
          fi

      - name: Upload platform artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: private-socks-binary-${{ matrix.id }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14

  build-image:
    name: Build linux/amd64 and linux/arm64 image
    needs:
      - verify
      - build-binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.image.outputs.digest }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Download Linux binaries
        uses: actions/download-artifact@v5
        with:
          pattern: private-socks-binary-linux-*
          path: dist
          merge-multiple: true

      - name: Verify Docker inputs
        shell: bash
        run: |
          set -euo pipefail
          chmod 0755 dist/sing-box-private-socks-linux-amd64 dist/sing-box-private-socks-linux-arm64
          test -x dist/sing-box-private-socks-linux-amd64
          test -x dist/sing-box-private-socks-linux-arm64
          file dist/sing-box-private-socks-linux-amd64
          file dist/sing-box-private-socks-linux-arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build and push multi-platform image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/private-socks/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            BUILD_VERSION=${{ env.VERSION_NAME }}
            BUILD_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Smoke-test published image
        shell: bash
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "$platform" "$IMAGE_NAME:$IMAGE_TAG" version
            docker run --rm --platform "$platform" -v "$PWD/docker/private-socks/config.example.json:/etc/sing-box/config.json:ro" "$IMAGE_NAME:$IMAGE_TAG" check -c /etc/sing-box/config.json
          done
          docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_TAG"

  publish-release:
    name: Publish GitHub Release
    if: ${{ github.event_name == 'push' || inputs.publish_release }}
    needs:
      - verify
      - build-binaries
      - build-image
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Download all binaries
        uses: actions/download-artifact@v5
        with:
          pattern: private-socks-binary-*
          path: dist
          merge-multiple: true

      - name: Prepare documentation and manifest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ needs.build-image.outputs.digest }}
        run: |
          set -euo pipefail
          core_commit="$(git rev-parse HEAD)"
          cp docker/private-socks/config.example.json dist/config.example.json
          cp docker/private-socks/docker-compose.yml dist/docker-compose.yml
          cp docker/private-socks/.env.example dist/env.example
          cp docker/private-socks/README.zh.md dist/README.zh.md

          find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 | sort -z | xargs -0 sha256sum | sed 's#  dist/#  #' > dist/SHA256SUMS

          {
            echo "Build time (UTC): $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "Repository: https://github.com/ztyawc/sing-box"
            echo "Core exact commit: $core_commit"
            echo "Version: $VERSION_NAME"
            echo "Go: $GO_VERSION"
            echo "CGO: disabled"
            echo "Build tags: $(cat release/DEFAULT_BUILD_TAGS_OTHERS)"
            echo "Platforms:"
            echo "  linux/amd64"
            echo "  linux/arm64"
            echo "  linux/arm/v7"
            echo "  windows/amd64"
            echo "  windows/arm64"
            echo "  darwin/amd64"
            echo "  darwin/arm64"
            echo "Container image: $IMAGE_NAME:$IMAGE_TAG"
            echo "Container platforms: linux/amd64, linux/arm64"
            echo "Container digest: $IMAGE_DIGEST"
            echo "Release tag: $RELEASE_TAG"
          } > dist/BUILD-MANIFEST.txt

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.build-image.outputs.digest }}
        run: |
          set -euo pipefail
          core_commit="$(git rev-parse HEAD)"
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo 'sing-box private SOCKS 0x80/0x82 multi-platform release.'
            echo
            echo "- Core commit: $core_commit"
            echo "- Docker: $IMAGE_NAME:$IMAGE_TAG"
            echo "- Docker platforms: linux/amd64 and linux/arm64"
            echo "- Docker digest: $IMAGE_DIGEST"
            echo '- Standalone binaries: Linux amd64/arm64/armv7, Windows amd64/arm64, macOS amd64/arm64.'
            echo '- No production server, username, password, or node configuration is included.'
          } > "$notes"

          mapfile -d '' archives < <(
            find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' -o -name '*.info.txt' \) -print0 | sort -z
          )
          assets=(
            "${archives[@]}"
            dist/SHA256SUMS
            dist/BUILD-MANIFEST.txt
            dist/config.example.json
            dist/docker-compose.yml
            dist/env.example
            dist/README.zh.md
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --target "$core_commit" --title "Private SOCKS multi-platform $IMAGE_TAG" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --target "$core_commit" --title "Private SOCKS multi-platform $IMAGE_TAG" --notes-file "$notes"
          fi
