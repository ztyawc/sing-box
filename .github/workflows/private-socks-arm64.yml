name: Build private SOCKS HTTP proxy for arm64

on:
  push:
    branches:
      - agent/private-socks-auth
    paths:
      - .github/workflows/private-socks-arm64.yml
      - docker/private-socks/**
  workflow_dispatch:
    inputs:
      image_tag:
        description: Container image tag
        required: true
        default: v2026.07.22-zty.1
        type: string
      release_tag:
        description: GitHub Release tag
        required: true
        default: private-socks-v2026.07.22-zty.1
        type: string
      publish_release:
        description: Publish binary and OCI image as a public GitHub Release
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: private-socks-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build linux/arm64 binary and container
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/sing-box-private-socks
      IMAGE_TAG: ${{ inputs.image_tag || 'v2026.07.22-zty.1' }}
      RELEASE_TAG: ${{ inputs.release_tag || 'private-socks-v2026.07.22-zty.1' }}
      VERSION_NAME: private-socks-${{ inputs.image_tag || 'v2026.07.22-zty.1' }}
      BINARY_NAME: sing-box-private-socks-linux-arm64
      OCI_NAME: sing-box-private-socks-linux-arm64.oci.tar.gz

    steps:
      - name: Checkout exact source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: 1.25.12
          cache-dependency-path: go.sum

      - name: Record and test exact source
        shell: bash
        run: |
          set -euo pipefail
          echo "CORE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git status --short
          go test -count=1 ./protocol/socks ./option

      - name: Build static linux/arm64 binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          build_tags="$(cat release/DEFAULT_BUILD_TAGS_OTHERS)"
          shared_ldflags="$(cat release/LDFLAGS)"
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -trimpath \
            -tags "$build_tags" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=$VERSION_NAME' $shared_ldflags -s -w -buildid=" \
            -o "dist/$BINARY_NAME" \
            ./cmd/sing-box
          chmod 0755 "dist/$BINARY_NAME"
          file "dist/$BINARY_NAME" | tee dist/BINARY-INFO.txt
          file "dist/$BINARY_NAME" | grep -q 'ARM aarch64'
          (cd dist && sha256sum "$BINARY_NAME" > "$BINARY_NAME.sha256")

      - name: Validate sanitized configuration
        shell: bash
        run: |
          set -euo pipefail
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/sing-box-check" ./cmd/sing-box
          "$RUNNER_TEMP/sing-box-check" check -c docker/private-socks/config.example.json

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build and push linux/arm64 image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/private-socks/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest-arm64
          build-args: |
            BUILD_VERSION=${{ env.VERSION_NAME }}
            BUILD_REVISION=${{ github.sha }}

      - name: Smoke-test published arm64 image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 "$IMAGE_NAME:$IMAGE_TAG" version
          docker run --rm --platform linux/arm64 \
            -v "$PWD/docker/private-socks/config.example.json:/etc/sing-box/config.json:ro" \
            "$IMAGE_NAME:$IMAGE_TAG" check -c /etc/sing-box/config.json
          docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_TAG"

      - name: Export OCI image archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/private-socks/Dockerfile
          platforms: linux/arm64
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          outputs: type=oci,dest=dist/sing-box-private-socks-linux-arm64.oci.tar
          build-args: |
            BUILD_VERSION=${{ env.VERSION_NAME }}
            BUILD_REVISION=${{ github.sha }}

      - name: Prepare release files and manifest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          gzip -9 dist/sing-box-private-socks-linux-arm64.oci.tar
          (cd dist && sha256sum "$OCI_NAME" > "$OCI_NAME.sha256")
          cp docker/private-socks/config.example.json dist/config.example.json
          cp docker/private-socks/docker-compose.yml dist/docker-compose.yml
          cp docker/private-socks/README.zh.md dist/README.zh.md
          {
            echo "Build time (UTC): $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "Repository: https://github.com/ztyawc/sing-box"
            echo "Core exact commit: $CORE_COMMIT"
            echo "Version: $VERSION_NAME"
            echo "Platform: linux/arm64"
            echo "CGO: disabled"
            echo "Go: $(go version)"
            echo "Image: $IMAGE_NAME:$IMAGE_TAG"
            echo "Image digest: $IMAGE_DIGEST"
            echo "Release tag: $RELEASE_TAG"
            echo "Binary SHA256: $(cut -d ' ' -f1 "dist/$BINARY_NAME.sha256")"
            echo "OCI archive SHA256: $(cut -d ' ' -f1 "dist/$OCI_NAME.sha256")"
          } > dist/BUILD-MANIFEST.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: private-socks-http-linux-arm64-${{ env.IMAGE_TAG }}
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || inputs.publish_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo 'Linux arm64 sing-box build with private SOCKS 0x80/0x82 support and a ready-to-use authenticated HTTP proxy container.'
            echo
            echo "- Exact core commit: \`$CORE_COMMIT\`"
            echo "- Container: \`$IMAGE_NAME:$IMAGE_TAG\`"
            echo "- Digest: \`$IMAGE_DIGEST\`"
            echo '- No production server or credentials are included.'
          } > "$notes"
          assets=(
            "dist/$BINARY_NAME"
            "dist/$BINARY_NAME.sha256"
            "dist/$OCI_NAME"
            "dist/$OCI_NAME.sha256"
            dist/BUILD-MANIFEST.txt
            dist/BINARY-INFO.txt
            dist/config.example.json
            dist/docker-compose.yml
            dist/README.zh.md
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$CORE_COMMIT" \
              --title "Private SOCKS HTTP proxy $IMAGE_TAG" \
              --notes-file "$notes"
          fi
